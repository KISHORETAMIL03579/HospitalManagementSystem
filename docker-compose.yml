services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: careflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP port
      - "8025:8025"   # Web UI dashboard
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
    volumes:
      - mailpit-data:/data

volumes:
  mailpit-data:
